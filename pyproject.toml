[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in default argument (common in LangChain)
]

[tool.ruff.lint.isort]
known-first-party = ["cortex"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Don't require annotations on every function — the project is incrementally typed
check_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
