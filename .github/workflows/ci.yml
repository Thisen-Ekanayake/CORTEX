name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python: unit tests ───────────────────────────────────────────────────
  # Heavy ML packages (torch, llama-cpp, chromadb) are stubbed in
  # tests/conftest.py, so only a lightweight install is needed here.
  python-tests:
    name: Python — unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install pytest pytest-cov scikit-learn joblib numpy requests

      - name: Run tests with coverage
        run: pytest --cov=cortex --cov=image_search --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: .coverage
          retention-days: 7

  # ── Python: lint & type-check ─────────────────────────────────────────────
  # Intentionally lightweight: no ML packages installed.
  # Heavy deps (torch, llama-cpp, sentence-transformers) are skipped;
  # mypy is configured to ignore missing stubs for those libraries.
  python-lint:
    name: Python — lint & type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff — lint
        run: ruff check cortex/ cli.py run.py image_search/

      - name: Ruff — format check
        run: ruff format --check cortex/ cli.py run.py image_search/

      - name: Mypy — type check
        run: mypy cortex/ --ignore-missing-imports --no-error-summary

  # ── Frontend: type check & build ─────────────────────────────────────────
  frontend:
    name: Frontend — type check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — type check
        run: npx tsc --noEmit

      - name: Vite — build
        run: npm run build

      - name: Upload build artifact
        # Only keep a dist snapshot for commits that land on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web_ui/dist/
          retention-days: 14
